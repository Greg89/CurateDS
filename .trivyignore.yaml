# Trivy ignore policy for image scans.
#
# Each entry MUST cite:
#   - the CVE / advisory ID
#   - which image(s) it applies to
#   - the reachability rationale (why the vuln is not exploitable here)
#
# Re-evaluate any time the web image's nginx base Alpine is bumped, or by
# 2026-09-01 at the latest. When `Fixed Version` becomes available in our
# base image's repo, prefer upgrading the base instead of suppressing here.

vulnerabilities:
  # libxml2 DoS via crafted XSD-validated document.
  # Reachable only through nginx's ngx_http_xslt_module (xslt_stylesheet
  # directive). Our web image's nginx.conf serves static files only and
  # never invokes XSLT/XSD processing on request bodies, so this code path
  # is unreachable. Alpine 3.21 advisory lists 2.13.9-r1 as fixed but the
  # package is not yet published to the 3.21 main/community mirrors, so
  # `apk upgrade` cannot pull the fix.
  - id: CVE-2026-6732

