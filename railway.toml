# Existing Railway services: API and one web service per environment.
# Beta follows develop; production follows main. Keep CI gating enabled.
#
# catalog-api: apps/api/Dockerfile, repository-root context, this config.
# catalog-web: apps/web/Dockerfile now builds Next.js V2, repository-root context.
#             Use /apps/web/railway.toml on the existing web service.
#             Keep its domain and port mapping; default container port is 8080.
#             Clear any old nginx/static start-command override.
#
# Web variables are now RUNTIME, server-only values:
# APP_BASE_URL, API_BASE_URL, AUTH0_DOMAIN, AUTH0_CLIENT_ID,
# AUTH0_CLIENT_SECRET, AUTH0_SECRET (64 hex characters), AUTH0_AUDIENCE.
# Use an Auth0 Regular Web Application with <APP_BASE_URL>/auth/callback,
# exact origin logout URL, refresh-token grant, and API offline access.
# Old VITE_* build variables do not configure V2.
#
# API retains Auth0__Domain, Auth0__Audience, ConnectionStrings__CatalogDb,
# Cors__AllowedOrigins__0, optional Serilog__SeqUrl and Serilog__SeqApiKey.
# Keep DB/storage volumes. Publication remains disabled pending acceptance.
# Seq stays private for ingestion; protect its UI with an admin password.
#
# In-place cutover, runtime preparation, smoke tests, and rollback:
# docs/refactor/20-v2-beta-cutover.md

[deploy]
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
