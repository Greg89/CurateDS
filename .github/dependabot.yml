version: 2

updates:
  # GitHub Actions — keep all workflow action versions current
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions

  # NuGet — .NET packages across all projects
  - package-ecosystem: nuget
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - dotnet
    groups:
      dotnet-test:
        patterns:
          - "coverlet.*"
          - "FluentAssertions"
          - "Microsoft.AspNetCore.Mvc.Testing"
          - "xunit*"

  # npm — root workspace (covers web, mobile, and test packages)
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - javascript
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      tanstack:
        patterns:
          - "@tanstack/*"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "msw"
          - "jsdom"

  # Docker — API image base
  - package-ecosystem: docker
    directory: /apps/api
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker

  # Docker — Web image base
  - package-ecosystem: docker
    directory: /apps/web
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker
