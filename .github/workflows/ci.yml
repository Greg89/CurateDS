name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install web dependencies
        run: npm install

      - name: Restore .NET
        run: dotnet restore CurateDS.sln

      - name: Build .NET
        run: dotnet build CurateDS.sln --no-restore

      - name: Test .NET
        run: dotnet test CurateDS.sln --no-build

      - name: Build web
        run: npm run build:web
