name: ci

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions: {}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Detect backend changes
        id: changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            backend:
              - 'apps/api/**'
              - 'packages/**'
              - 'tests/**'
              - '!tests/Web.UnitTests/**'
              - '!tests/EndToEndTests/**'
              - 'CurateDS.sln'
              - 'Directory.Build.props'
              - 'global.json'
              - '.github/workflows/ci.yml'

      - name: Setup .NET
        if: steps.changes.outputs.backend == 'true'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        if: steps.changes.outputs.backend == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        if: steps.changes.outputs.backend == 'true'
        run: dotnet restore CurateDS.sln

      - name: Format check
        if: steps.changes.outputs.backend == 'true'
        run: dotnet format CurateDS.sln --verify-no-changes

      - name: Build
        if: steps.changes.outputs.backend == 'true'
        run: dotnet build CurateDS.sln --no-restore

      - name: Test
        if: steps.changes.outputs.backend == 'true'
        run: dotnet test CurateDS.sln --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory coverage

      - name: Upload backend coverage to Codecov
        if: steps.changes.outputs.backend == 'true'
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/**/coverage.cobertura.xml
          flags: backend
          fail_ci_if_error: false

      - name: Scan NuGet packages for vulnerabilities
        if: steps.changes.outputs.backend == 'true'
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee /tmp/nuget-vulns.txt
          if grep -q "has the following vulnerable packages" /tmp/nuget-vulns.txt; then
            echo "Vulnerable NuGet packages found — failing build"
            exit 1
          fi

  frontend:
    name: frontend
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Detect frontend changes
        id: changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            frontend:
              - 'apps/web/**'
              - 'tests/Web.UnitTests/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

      - name: Setup Node
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.frontend == 'true'
        run: npm ci

      - name: Audit npm dependencies
        if: steps.changes.outputs.frontend == 'true'
        run: npm audit --workspace @curateds/web --workspace @curateds/web-tests --audit-level=high

      - name: Build web
        if: steps.changes.outputs.frontend == 'true'
        run: npm run build:web

      - name: Test web
        if: steps.changes.outputs.frontend == 'true'
        run: npm run test:web:coverage

      - name: Upload frontend coverage to Codecov
        if: steps.changes.outputs.frontend == 'true'
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: tests/Web.UnitTests/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  mobile:
    name: mobile
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Detect mobile changes
        id: changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

      - name: Setup Node
        if: steps.changes.outputs.mobile == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.mobile == 'true'
        run: npm ci

      - name: Typecheck mobile
        if: steps.changes.outputs.mobile == 'true'
        run: npm run typecheck:mobile

      - name: Audit npm dependencies
        if: steps.changes.outputs.mobile == 'true'
        # HIGH vulns are in Expo's build toolchain (jest-expo, expo-constants/plist)
        # and have no non-breaking fix until the next Expo SDK upgrade.
        # Gate on critical only until mobile is actively maintained again.
        run: npm audit --workspace @curateds/mobile --audit-level=critical

      - name: Test mobile
        if: steps.changes.outputs.mobile == 'true'
        run: npm run test:mobile:coverage

      - name: Upload mobile coverage to Codecov
        if: steps.changes.outputs.mobile == 'true'
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/mobile/coverage/lcov.info
          flags: mobile
          fail_ci_if_error: false
