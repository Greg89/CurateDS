name: ci

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions: {}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: regression-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore CurateDS.sln

      - name: Build
        run: dotnet build CurateDS.sln --no-restore

      - name: Test
        env:
          CURATEDS_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Username=postgres;Password=regression-only;Database=postgres
        run: dotnet test CurateDS.sln --no-build --verbosity normal

  frontend:
    name: frontend
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build web
        run: npm run build:web

      - name: Test web
        run: npm run test:web

      - name: Build legacy reference client
        run: npm run build:web:legacy

      - name: Test legacy reference client
        run: npm run test:web:legacy

      - name: Install V2 browser
        run: npx playwright install --with-deps chromium

      - name: Build deployment image
        run: docker build -f apps/web/Dockerfile -t curateds-web-regression .

      - name: Test V2 browser flows in deployment image
        env:
          PLAYWRIGHT_DOCKER_IMAGE: curateds-web-regression
        run: npm run test:e2e --workspace @curateds/web-v2
