name: ci

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CurateDS.sln

      - name: Build
        run: dotnet build CurateDS.sln --no-restore

      - name: Test
        run: dotnet test CurateDS.sln --no-build --verbosity normal

  frontend:
    name: frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build:web

      - name: Test web
        run: npm run test:web

  mobile:
    name: mobile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect mobile changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

      - name: Setup Node
        if: steps.changes.outputs.mobile == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.mobile == 'true'
        run: npm ci

      - name: Typecheck mobile
        if: steps.changes.outputs.mobile == 'true'
        run: npm run typecheck:mobile

      - name: Test mobile
        if: steps.changes.outputs.mobile == 'true'
        run: npm run test:mobile
