name: docker

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches:
      - main
      - develop

# Only run when the CI workflow completes successfully
permissions: {}

jobs:
  guard-trivy-ignore-sync:
    name: guard trivy ignore sync
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify Trivy ignore files are in sync
        shell: bash
        run: |
          set -euo pipefail

          yaml_file=".trivyignore.yaml"
          text_file=".trivyignore"

          if [ ! -f "$yaml_file" ] || [ ! -f "$text_file" ]; then
            echo "Expected both $yaml_file and $text_file to exist."
            exit 1
          fi

          yaml_ids="$(mktemp)"
          text_ids="$(mktemp)"
          only_yaml="$(mktemp)"
          only_text="$(mktemp)"

          trap 'rm -f "$yaml_ids" "$text_ids" "$only_yaml" "$only_text"' EXIT

          sed -n 's/^\s*-\s*id:\s*\([A-Za-z0-9._-]\+\)\s*$/\1/p' "$yaml_file" | sort -u > "$yaml_ids"
          sed -e 's/#.*$//' -e 's/^\s*//' -e 's/\s*$//' "$text_file" | sed '/^$/d' | sort -u > "$text_ids"

          comm -23 "$yaml_ids" "$text_ids" > "$only_yaml"
          comm -13 "$yaml_ids" "$text_ids" > "$only_text"

          if [ -s "$only_yaml" ] || [ -s "$only_text" ]; then
            echo "Trivy ignore files are out of sync."
            if [ -s "$only_yaml" ]; then
              echo "IDs present only in $yaml_file:"
              cat "$only_yaml"
            fi
            if [ -s "$only_text" ]; then
              echo "IDs present only in $text_file:"
              cat "$only_text"
            fi
            echo "Keep rationale in $yaml_file and ID list in $text_file synchronized."
            exit 1
          fi

          echo "Trivy ignore files are in sync."

  build-api:
    name: build & push api
    runs-on: ubuntu-latest
    needs: [guard-trivy-ignore-sync]
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}

    permissions:
      contents: read
      packages: write  # required to push to ghcr.io
      security-events: write  # required to upload SARIF results

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Sanitize branch tag
        id: branch_tag
        shell: bash
        run: |
          set -euo pipefail

          branch="${{ github.event.workflow_run.head_branch }}"
          sanitized="$(printf '%s' "$branch" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"

          if [ -z "$sanitized" ]; then
            echo "Unable to derive a Docker-safe tag from branch '$branch'." >&2
            exit 1
          fi

          echo "value=$sanitized" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/greg89/curateds-api
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=${{ steps.branch_tag.outputs.value }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan API image with Trivy (SARIF report)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          trivyignores: .trivyignore

      - name: Upload Trivy API scan results
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

      - name: Gate on API image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Push API image to GHCR
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    name: build & push web
    runs-on: ubuntu-latest
    needs: [guard-trivy-ignore-sync]
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}

    permissions:
      contents: read
      packages: write
      security-events: write  # required to upload SARIF results

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Sanitize branch tag
        id: branch_tag
        shell: bash
        run: |
          set -euo pipefail

          branch="${{ github.event.workflow_run.head_branch }}"
          sanitized="$(printf '%s' "$branch" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"

          if [ -z "$sanitized" ]; then
            echo "Unable to derive a Docker-safe tag from branch '$branch'." >&2
            exit 1
          fi

          echo "value=$sanitized" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/greg89/curateds-web
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=${{ steps.branch_tag.outputs.value }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APK_UPGRADE_CACHEBUST=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan web image with Trivy (SARIF report)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-web.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          trivyignores: .trivyignore

      - name: Upload Trivy web scan results
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: trivy-web.sarif
          category: trivy-web

      - name: Gate on web image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Push web image to GHCR
        run: |
          set -e
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
