name: docker

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches:
      - main
      - develop

# Only run when the CI workflow completes successfully
permissions: {}

jobs:
  guard-trivy-ignore-sync:
    name: guard trivy ignore sync
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify Trivy ignore files are in sync
        shell: bash
        run: |
          set -euo pipefail

          yaml_file=".trivyignore.yaml"
          text_file=".trivyignore"

          if [ ! -f "$yaml_file" ] || [ ! -f "$text_file" ]; then
            echo "Expected both $yaml_file and $text_file to exist."
            exit 1
          fi

          yaml_ids="$(mktemp)"
          text_ids="$(mktemp)"
          only_yaml="$(mktemp)"
          only_text="$(mktemp)"

          trap 'rm -f "$yaml_ids" "$text_ids" "$only_yaml" "$only_text"' EXIT

          sed -n 's/^\s*-\s*id:\s*\([A-Za-z0-9._-]\+\)\s*$/\1/p' "$yaml_file" | sort -u > "$yaml_ids"
          sed -e 's/#.*$//' -e 's/^\s*//' -e 's/\s*$//' "$text_file" | sed '/^$/d' | sort -u > "$text_ids"

          comm -23 "$yaml_ids" "$text_ids" > "$only_yaml"
          comm -13 "$yaml_ids" "$text_ids" > "$only_text"

          if [ -s "$only_yaml" ] || [ -s "$only_text" ]; then
            echo "Trivy ignore files are out of sync."
            if [ -s "$only_yaml" ]; then
              echo "IDs present only in $yaml_file:"
              cat "$only_yaml"
            fi
            if [ -s "$only_text" ]; then
              echo "IDs present only in $text_file:"
              cat "$only_text"
            fi
            echo "Keep rationale in $yaml_file and ID list in $text_file synchronized."
            exit 1
          fi

          echo "Trivy ignore files are in sync."

  build-api:
    name: build & push api
    runs-on: ubuntu-latest
    needs: [guard-trivy-ignore-sync]
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read
      packages: write  # required to push to ghcr.io
      security-events: write  # required to upload SARIF results

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/greg89/curateds-api
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=${{ github.event.workflow_run.head_branch }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan API image with Trivy (SARIF report)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          trivyignores: .trivyignore

      - name: Upload Trivy API scan results
        if: always()
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

      - name: Gate on API image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Push API image to GHCR
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    name: build & push web
    runs-on: ubuntu-latest
    needs: [guard-trivy-ignore-sync]
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read
      packages: write
      security-events: write  # required to upload SARIF results

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/greg89/curateds-web
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=${{ github.event.workflow_run.head_branch }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build web image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APK_UPGRADE_CACHEBUST=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan web image with Trivy (SARIF report)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-web.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          trivyignores: .trivyignore

      - name: Upload Trivy web scan results
        if: always()
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: trivy-web.sarif
          category: trivy-web

      - name: Gate on web image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Push web image to GHCR
        run: |
          set -e
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
