name: Beta deployment smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-deployment-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Read-only beta deployment check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BETA_ORIGIN: https://curateds-client-beta.up.railway.app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check deployed beta
        shell: bash
        run: |
          {
            echo "### Beta deployment smoke"
            echo
            echo "Target: \`$BETA_ORIGIN\`"
            echo
            echo '~~~text'
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          node apps/web-v2/scripts/check-deployment.mjs --origin "$BETA_ORIGIN" 2>&1 |
            tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
