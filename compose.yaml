services:
  postgres:
    image: postgres:17-alpine
    container_name: curateds-postgres
    environment:
      POSTGRES_DB: curateds
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - curateds-postgres-data:/var/lib/postgresql/data

volumes:
  curateds-postgres-data:
